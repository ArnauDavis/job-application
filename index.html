<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job application</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>Job Application</h1>
        <!-- Image underneath the header -->
        <div class="header-image">
            <img src="/images/job-header.jpg" alt="Job Application Image">
        </div>

        <!-- Logo section between the image and the form -->
        <div class="logo">
            <img src="/images/logo.png" alt="Company Logo">
        </div>
        <form action="/createApplication" method="post" class="applicationForm">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

            <label for="address">Address</label>
            <div id="address">
                <label for="street">Street:</label>
                <input type="text" id="street" name="street" placeholder="Enter your street address">

                <label for="city">City:</label>
                <input type="text" id="city" name="city" placeholder="Enter your city">

                <label for="state">State:</label>
                <select type="text" name="state" id="state">
                    <option value="Florida">Florida</option>
                    <option value="Alabama">Alabama</option>
                    <option value="Alaska">Alaska</option>
                    <option value="Arizona">Arizona</option>
                    <option value="Arkansas">Arkansas</option>
                    <option value="California">California</option>
                    <option value="Colorado">Colorado</option>
                    <option value="Connecticut">Connecticut</option>
                    <option value="Delaware">Delaware</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Hawaii">Hawaii</option>
                    <option value="Idaho">Idaho</option>
                    <option value="Illinois">Illinois</option>
                    <option value="Indiana">Indiana</option>
                    <option value="Iowa">Iowa</option>
                    <option value="Kansas">Kansas</option>
                    <option value="Kentucky">Kentucky</option>
                    <option value="Louisiana">Louisiana</option>
                    <option value="Maine">Maine</option>
                    <option value="Maryland">Maryland</option>
                    <option value="Massachusetts">Massachusetts</option>
                    <option value="Michigan">Michigan</option>
                    <option value="Minnesota">Minnesota</option>
                    <option value="Mississippi">Mississippi</option>
                    <option value="Missouri">Missouri</option>
                    <option value="Montana">Montana</option>
                    <option value="Nebraska">Nebraska</option>
                    <option value="Nevada">Nevada</option>
                    <option value="New Hampshire">New Hampshire</option>
                    <option value="New Jersey">New Jersey</option>
                    <option value="New Mexico">New Mexico</option>
                    <option value="New York">New York</option>
                    <option value="North Carolina">North Carolina</option>
                    <option value="North Dakota">North Dakota</option>
                    <option value="Ohio">Ohio</option>
                    <option value="Oklahoma">Oklahoma</option>
                    <option value="Oregon">Oregon</option>
                    <option value="Pennsylvania">Pennsylvania</option>
                    <option value="Rhode Island">Rhode Island</option>
                    <option value="South Carolina">South Carolina</option>
                    <option value="South Dakota">South Dakota</option>
                    <option value="Tennessee">Tennessee</option>
                    <option value="Texas">Texas</option>
                    <option value="Utah">Utah</option>
                    <option value="Vermont">Vermont</option>
                    <option value="Virginia">Virginia</option>
                    <option value="Washington">Washington</option>
                    <option value="West Virginia">West Virginia</option>
                    <option value="Wisconsin">Wisconsin</option>
                    <option value="Wyoming">Wyoming</option>
                </select>

                <label for="zip">Zip Code:</label>
                <input type="text" id="zip" name="zip" placeholder="Enter your zip code">

                <label for="unhoused">Are you currently unhoused?</label>
                <select id="unhoused" name="unhoused">
                    <option value="" disabled selected>Select an option</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="experience">Past Work Experience:</label>
            <div id="workExperience">
                <div class="workEntry">
                    <input type="text" placeholder="Company" name="company1" class="companyName">
                    <input type="date" name="startDate1" class="startDate">
                    <input type="date" name="endDate1" class="endDate">
            </div>

            <label for="references">Reference (Name, Relationship, Phone Number):</label>
            <div id="references">
                <div class="referenceEntry">
                    <input type="text" placeholder="Reference Name" name="referenceName1">
                    <input type="text" placeholder="Relationship" name="referenceRelation1">
                    <input type="tel" placeholder="Phone Number" name="referencePhone1">
                </div>
            </div>

            <label for="question1">1. What motivates you to apply for this position and how does it align with your personal or professional goals?</label>
            <textarea id="question1" name="question1" rows="3"></textarea>

            <label for="question2">2. Describe a challenge you've faced in your professional or personal life and how you overcame it.</label>
            <textarea id="question2" name="question2" rows="3"></textarea>
            
            <label for="question3">3. How did you hear about us?</label>
            <textarea id="question3" name="question3" rows="3"></textarea>


            <button type="submit">Submit Application</button>
        </form>
    </div>
    <script type='text/javascript' src='/main.js'></script>
</body>
</html>
